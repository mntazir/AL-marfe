<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منتجاتنا المميزة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="path/to/logo.png" alt="مكتبة المعارف">
            <h1>منتجاتنا المميزة</h1>
        </div>
    </header>
    <main>
        <div class="cta">أفضل العروض والمنتجات التي تناسب احتياجاتك، تسوق الآن!</div>
        <div id="productGallery" class="gallery">
            <!-- المنتجات يتم إضافتها هنا عبر JavaScript -->
        </div>
    </main>
    <footer class="footer">
        جميع الحقوق محفوظة &copy; 2025 - مكتبة المعارف
    </footer>

    <div id="imageModal" class="modal">
        <img id="modalImage" class="modal-image" alt="صورة مكبرة">
        <button class="close-btn" onclick="closeModal()">إغلاق</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
